<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e8">
  <title>你的週末探險人格｜小小心理測驗</title>
  <style>
    :root {
      --ink: #252b37;
      --muted: #697386;
      --paper: #fffdf8;
      --cream: #f6f1e8;
      --orange: #f18b62;
      --blue: #8ab8d8;
      --green: #a9c99d;
      --yellow: #f1d27b;
      --line: #e9e2d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, #f7d9bd 0 7%, transparent 7.2%),
        radial-gradient(circle at 88% 82%, #d6e8d1 0 9%, transparent 9.2%),
        var(--cream);
      font-family: ui-rounded, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(100%, 680px); }
    .topline {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 4px 12px; color: var(--muted); font-size: .85rem; letter-spacing: .04em;
    }
    .badge { display: inline-flex; gap: 7px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); }
    .card {
      position: relative; overflow: hidden; min-height: 490px; padding: clamp(26px, 6vw, 54px);
      border: 1px solid rgba(255,255,255,.8); border-radius: 28px;
      background: var(--paper); box-shadow: 0 20px 60px rgba(65, 57, 44, .11);
    }
    .card::before {
      content: ""; position: absolute; width: 170px; height: 170px; top: -94px; right: -38px;
      border-radius: 50%; background: #f8dfc8; opacity: .7;
    }
    .screen { position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 12px; color: #d57550; font-size: .82rem; font-weight: 800; letter-spacing: .15em; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.2; letter-spacing: -.04em; }
    .intro { max-width: 490px; margin: 18px 0 25px; color: var(--muted); font-size: 1.05rem; line-height: 1.8; }
    .illustration { display: flex; justify-content: center; margin: 6px 0 24px; font-size: 4.8rem; filter: drop-shadow(0 8px 0 #f7ead8); }
    .primary, .secondary {
      min-height: 52px; border: 0; border-radius: 15px; padding: 0 24px; cursor: pointer;
      font-weight: 800; transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .primary { color: #fff; background: var(--ink); box-shadow: 0 5px 0 #111720; }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #111720; }
    .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #111720; }
    .secondary { color: var(--ink); background: #f0ece4; }
    .secondary:hover { background: #e8e1d6; }
    button:focus-visible { outline: 3px solid #4b8fbd; outline-offset: 3px; }
    .note { margin: 16px 0 0; color: #858b96; font-size: .8rem; line-height: 1.6; }
    .progress-row { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--muted); font-size: .88rem; }
    .track { height: 8px; margin-bottom: 30px; overflow: hidden; border-radius: 99px; background: #f0ece4; }
    .fill { height: 100%; width: 0; border-radius: inherit; background: var(--orange); transition: width .3s ease; }
    h2 { margin: 0 0 22px; font-size: clamp(1.35rem, 4vw, 1.75rem); line-height: 1.5; }
    .answers { display: grid; gap: 11px; }
    .answer {
      width: 100%; min-height: 58px; padding: 14px 17px; display: flex; gap: 12px; align-items: center;
      text-align: left; border: 1.5px solid var(--line); border-radius: 15px; background: #fff;
      color: var(--ink); cursor: pointer; line-height: 1.45; transition: .16s ease;
    }
    .answer:hover { border-color: var(--orange); background: #fffaf4; transform: translateY(-1px); }
    .letter { flex: 0 0 29px; width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: #f5eee3; font-weight: 800; }
    .result-icon { font-size: 4.4rem; margin: 5px 0 8px; }
    .result-title { margin-bottom: 10px; }
    .result-copy { color: var(--muted); font-size: 1.02rem; line-height: 1.85; }
    .result-tip { margin: 20px 0 25px; padding: 16px 18px; border-left: 4px solid var(--green); border-radius: 0 13px 13px 0; background: #f3f7ef; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 25px; }
    .hidden { display: none !important; }
    @media (max-width: 520px) {
      body { padding: 14px 12px; }
      .card { min-height: 0; padding: 30px 22px; border-radius: 23px; }
      .illustration { font-size: 4rem; }
      .answer { min-height: 62px; }
      .actions button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline"><span class="badge"><span class="dot"></span>一分鐘小測驗</span><span>✦ 週末特別篇</span></div>
    <section class="card" aria-live="polite">
      <div id="welcome" class="screen">
        <p class="eyebrow">A LITTLE PERSONALITY QUIZ</p>
        <div class="illustration" aria-hidden="true">🧭</div>
        <h1>你的週末<br>探險人格是？</h1>
        <p class="intro">如果突然多出一個空閒週末，你會怎麼安排？用 5 個小選擇，看看你是哪一種探險派。</p>
        <button class="primary" id="start">開始測驗 <span aria-hidden="true">→</span></button>
        <p class="note">這是輕鬆玩的趣味測驗，結果不代表專業心理評估。</p>
      </div>

      <div id="quiz" class="screen hidden">
        <div class="progress-row"><span id="question-number">第 1 題，共 5 題</span><span id="progress-percent">20%</span></div>
        <div class="track" role="progressbar" aria-label="測驗進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><div class="fill" id="progress-fill"></div></div>
        <h2 id="question-text"></h2>
        <div class="answers" id="answers"></div>
      </div>

      <div id="result" class="screen hidden">
        <p class="eyebrow">你的探險人格出爐了</p>
        <div class="result-icon" id="result-icon" aria-hidden="true"></div>
        <h1 class="result-title" id="result-title"></h1>
        <p class="result-copy" id="result-copy"></p>
        <div class="result-tip" id="result-tip"></div>
        <div class="actions"><button class="primary" id="restart">再玩一次 ↻</button><button class="secondary" id="share">複製結果</button></div>
        <p class="note">僅供娛樂，不能取代心理諮詢或專業評估。</p>
      </div>
    </section>
  </main>
  <script>
    const questions = [
      { text: "週五下班，朋友突然說明天出發去玩。你第一個反應是？", answers: [
        ["先查交通、天氣和營業時間，心裡比較踏實。", "A"], ["好啊！到時候再看要去哪。", "B"], ["先問誰會去、大家想要什麼氣氛。", "C"], ["可以，先把集合時間和必帶物品確認好。", "D"]
      ]},
      { text: "到了陌生的小鎮，你最想先做什麼？", answers: [
        ["打開地圖，挑一條順路又不繞的路線。", "A"], ["隨便走走，看到有趣的店就進去。", "B"], ["找一家看起來舒服的咖啡店坐一下。", "C"], ["先找到景點，把最想看的地方打卡完成。", "D"]
      ]},
      { text: "旅行途中突然下雨，你會？", answers: [
        ["拿出備案，改去附近室內景點。", "A"], ["反而覺得有趣，穿雨衣繼續晃。", "B"], ["找個地方休息，享受慢下來的時間。", "C"], ["快速確認雨會下多久，再決定下一站。", "D"]
      ]},
      { text: "一天結束後，你最喜歡留下哪種回憶？", answers: [
        ["一張記錄完整行程的小地圖。", "A"], ["一段意料之外、現在想起來還好笑的插曲。", "B"], ["和朋友聊天、看夕陽的舒服片刻。", "C"], ["把清單上想做的事都完成了。", "D"]
      ]},
      { text: "如果只能帶一樣東西出門，你會選？", answers: [
        ["行程筆記，重要資訊都在裡面。", "A"], ["相機，遇到什麼都能留下來。", "B"], ["喜歡的耳機，隨時切換自己的節奏。", "C"], ["行動電源，確保旅程不中斷。", "D"]
      ]}
    ];
    const results = {
      A: { icon: "🗺️", title: "路線規劃師", copy: "你喜歡先掌握方向，再安心出發。準備不是掃興，而是讓你有餘裕享受旅程；有了地圖，你也更敢探索沒去過的地方。", tip: "給你的週末提案：留一段「不排計畫」的空白，讓偶然也有機會加入行程。" },
      B: { icon: "🦋", title: "隨興探索家", copy: "你很會把意外變成故事。比起照表走完，你更享受路上突然發現的小店、巷子和新鮮事，彈性是你的旅行超能力。", tip: "給你的週末提案：出門前只決定集合地點，其他交給當天的好奇心。" },
      C: { icon: "☁️", title: "氛圍收藏家", copy: "對你來說，旅程的感受和同行的人同樣重要。舒服的步調、一頓好吃的飯、一段自在的聊天，都能成為很珍貴的回憶。", tip: "給你的週末提案：挑一個喜歡的地方待久一點，不必急著把景點全部跑完。" },
      D: { icon: "🏁", title: "任務通關者", copy: "你喜歡把想做的事一項項完成，清楚的目標會讓你很有成就感。你也常是團體裡那個讓大家順利出發、準時抵達的人。", tip: "給你的週末提案：清單只留前三名，完成後就放心享受剩下的時間。" }
    };
    const screens = ["welcome", "quiz", "result"].map(id => document.getElementById(id));
    let current = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0 };
    function showScreen(id) { screens.forEach(screen => screen.classList.toggle("hidden", screen.id !== id)); }
    function renderQuestion() {
      const q = questions[current];
      const percent = Math.round(((current + 1) / questions.length) * 100);
      document.getElementById("question-number").textContent = `第 ${current + 1} 題，共 ${questions.length} 題`;
      document.getElementById("progress-percent").textContent = `${percent}%`;
      document.getElementById("progress-fill").style.width = `${percent}%`;
      document.querySelector(".track").setAttribute("aria-valuenow", percent);
      document.getElementById("question-text").textContent = q.text;
      const answers = document.getElementById("answers");
      answers.replaceChildren();
      q.answers.forEach(([label, type], index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.querySelector("span:last-child").textContent = label;
        button.addEventListener("click", () => choose(type));
        answers.append(button);
      });
    }
    function choose(type) {
      scores[type]++;
      current++;
      if (current < questions.length) renderQuestion(); else showResult();
    }
    function showResult() {
      const max = Math.max(...Object.values(scores));
      const tied = Object.keys(scores).filter(key => scores[key] === max);
      const type = tied[Math.floor(Math.random() * tied.length)];
      const result = results[type];
      document.getElementById("result-icon").textContent = result.icon;
      document.getElementById("result-title").textContent = result.title;
      document.getElementById("result-copy").textContent = result.copy;
      document.getElementById("result-tip").textContent = result.tip;
      document.getElementById("share").dataset.text = `我的週末探險人格是「${result.title}」！`;
      showScreen("result");
    }
    document.getElementById("start").addEventListener("click", () => { current = 0; scores = { A: 0, B: 0, C: 0, D: 0 }; showScreen("quiz"); renderQuestion(); });
    document.getElementById("restart").addEventListener("click", () => { current = 0; scores = { A: 0, B: 0, C: 0, D: 0 }; showScreen("quiz"); renderQuestion(); });
    document.getElementById("share").addEventListener("click", async event => {
      const button = event.currentTarget;
      try {
        await navigator.clipboard.writeText(button.dataset.text);
        button.textContent = "已複製 ✓";
        setTimeout(() => { button.textContent = "複製結果"; }, 1600);
      } catch {
        button.textContent = button.dataset.text;
      }
    });
  </script>
</body>
</html>
